# Nom du site
title: AISI Cyber-Team
description: Cyber-Team Homepage

# URL du site (remplacez par votre URL GitHub Pages)

# Paramètres de Jekyll
#theme: minima  # Thème par défaut de Jekyll
#remote_theme: academicpages/academicpages.github.io@v0.8.4
#remote_theme: pages-themes/hacker@v0.2.0
remote_theme: pages-themes/architect@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-toc

toc:
  min: 1
  max: 3
#custom_css_path: /assets/css/style.css

markdown: kramdown  # Moteur de conversion Markdown

# Dossiers et fichiers à inclure/exclure
#include: [_pages]
include:
  - dfir
  - offsec
  - threatintel
#exclude: [README.md, LICENSE]

# Paramètres pour les articles de blog
permalink: /:year/:month/:day/:title/



