  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n/* AISI spacing, radii, shadows, motion — 4px base grid */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Radii */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n  --radius-round: 50%;\n\n  /* Shadows — soft, cool-tinted from navy */\n  --shadow-xs: 0 1px 2px rgba(33, 87, 142, 0.08);\n  --shadow-sm: 0 2px 6px rgba(33, 87, 142, 0.10);\n  --shadow-md: 0 6px 18px rgba(33, 87, 142, 0.12);\n  --shadow-lg: 0 16px 40px rgba(33, 87, 142, 0.16);\n  --shadow-focus: 0 0 0 3px color-mix(in srgb, var(--aisi-blue) 40%, #fff);\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   320ms; /* @kind other */\n\n  /* Layout */\n  --container-max: 1200px; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"1c3c9d91-d15c-4e53-8461-4dbb7764d2df\"><\u002Fscript>\n<style>\n  body { margin: 0; font-family: var(--font-body); color: var(--text-body); background: #fff; -webkit-font-smoothing: antialiased; }\n  a { color: var(--text-link); text-decoration: none; }\n  a:hover { color: var(--text-link-hover); }\n  .prose p { font-size: 18px; line-height: 1.75; color: var(--gray-800); margin: 0 0 22px; }\n  .prose p:first-of-type { font-size: 20px; }\n  .prose h2 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.01em; color: var(--aisi-navy); margin: 52px 0 18px; scroll-margin-top: 96px; }\n  .prose h3 { font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--aisi-navy); margin: 34px 0 12px; }\n  .prose ul { margin: 0 0 22px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }\n  .prose ul li { position: relative; padding-left: 30px; font-size: 18px; line-height: 1.65; color: var(--gray-800); }\n  .prose ul li::before { content: \"\"; position: absolute; left: 6px; top: 11px; width: 7px; height: 7px; border-radius: 2px; background: var(--aisi-blue); transform: rotate(45deg); }\n  .prose ol { margin: 0 0 22px; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; }\n  .prose ol li { font-size: 18px; line-height: 1.65; color: var(--gray-800); padding-left: 6px; }\n  .prose ol li::marker { font-family: var(--font-display); font-weight: 800; color: var(--aisi-blue); }\n  .prose strong { color: var(--aisi-navy); font-weight: 700; }\n  .prose code { font-family: var(--font-mono); font-size: .88em; background: var(--aisi-blue-30); color: var(--aisi-navy); padding: 2px 7px; border-radius: 5px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh\">\n\n<header style=\"position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px\">\n    <img src=\"bc0a4f42-c499-4e14-a84d-0e28e77aa8ac\" alt=\"AISI\" style=\"height:30px;width:auto;display:block\">\n    <nav style=\"display:flex;gap:4px;margin-left:auto;font-family:var(--font-display);font-size:15px;font-weight:500\">\n      <span style=\"padding:8px 14px;color:var(--text-muted)\">Services<\u002Fspan>\n      <span style=\"padding:8px 14px;color:var(--aisi-navy);font-weight:700\">Blog<\u002Fspan>\n      <span style=\"padding:8px 14px;color:var(--text-muted)\">À propos<\u002Fspan>\n      <span style=\"padding:8px 14px;color:var(--text-muted)\">Contact<\u002Fspan>\n    <\u002Fnav>\n    <x-import component-from-global-scope=\"DesignSystem_4b8b60.Button\" variant=\"primary\" size=\"sm\" hint-size=\"140px,36px\">Nous contacter<\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- Article header band -->\n<section style=\"background:linear-gradient(155deg,var(--aisi-navy) 0%,#173f68 55%,#102d4b 100%);color:#fff\">\n  <div style=\"max-width:820px;margin:0 auto;padding:56px 32px 64px\">\n    <nav aria-label=\"Fil d'Ariane\" style=\"display:flex;align-items:center;gap:9px;font-size:13px;font-family:var(--font-display);font-weight:500;color:var(--aisi-blue-60);margin-bottom:30px\">\n      <span>Blog<\u002Fspan>\n      <span style=\"opacity:.5\">/<\u002Fspan>\n      <span>Cybersécurité<\u002Fspan>\n      <span style=\"opacity:.5\">/<\u002Fspan>\n      <span style=\"color:#fff;opacity:.9\">Ransomware<\u002Fspan>\n    <\u002Fnav>\n    <div style=\"display:flex;gap:10px;margin-bottom:22px\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Badge\" tone=\"orange\" hint-size=\"120px,24px\">Cybersécurité<\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Badge\" tone=\"blue\" hint-size=\"90px,24px\">Menaces<\u002Fx-import>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.02em;margin:0 0 20px\">Ransomware : anatomie d'une attaque et stratégie de défense en profondeur<\u002Fh1>\n    <p style=\"font-size:20px;line-height:1.6;color:var(--aisi-blue-60);max-width:660px;margin:0 0 34px\">Comprendre le déroulé technique d'une campagne de rançongiciel, de l'intrusion initiale au chiffrement — et les contre-mesures concrètes à déployer côté équipes d'ingénierie et d'exploitation.<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <div style=\"width:44px;height:44px;border-radius:50%;background:var(--aisi-blue);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:16px;color:#fff;flex-shrink:0\">CM<\u002Fdiv>\n        <div style=\"line-height:1.35\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff\">Camille Mercier<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--aisi-blue-60)\">Consultante SOC · AISI<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;height:32px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;font-size:13.5px;color:var(--aisi-blue-60);font-family:var(--font-display);font-weight:500\">\n        <span>15 juillet 2026<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>11 min de lecture<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Body: TOC + article -->\n<div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 40px;display:grid;grid-template-columns:230px 1fr;gap:56px;align-items:start\">\n\n  <!-- TOC -->\n  <aside style=\"position:sticky;top:88px\">\n    <div style=\"font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px\">Sommaire<\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--border-subtle)\">\n      <sc-for list=\"{{ toc }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <a href=\"{{ item.href }}\" sc-camel-on-click=\"{{ item.onClick }}\" data-active=\"{{ item.active }}\" style=\"{{ item.style }}\">{{ item.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <!-- Article -->\n  <article class=\"prose\" style=\"max-width:680px;min-width:0\">\n    <p><strong>Un rançongiciel ne « frappe » jamais d'un coup.<\u002Fstrong> Ce qui se présente comme un événement soudain — des postes chiffrés au petit matin, une note de rançon en fond d'écran — est en réalité l'aboutissement d'une intrusion qui s'est déroulée sur plusieurs jours, parfois plusieurs semaines. Comprendre cette temporalité est la première étape d'une défense efficace.<\u002Fp>\n    <p>Cet article décompose le cycle de vie d'une attaque par ransomware du point de vue d'une équipe technique, puis détaille une stratégie de défense en profondeur applicable à un système d'information réel.<\u002Fp>\n\n    <h2 id=\"sec-definition\">Qu'est-ce qu'un ransomware ?<\u002Fh2>\n    <p>Un <strong>rançongiciel<\u002Fstrong> est un logiciel malveillant qui chiffre les données d'un système et exige le versement d'une rançon en échange de la clé de déchiffrement. Les campagnes modernes reposent presque toutes sur la <strong>double extorsion<\u002Fstrong> : les données sont exfiltrées <em>avant<\u002Fem> d'être chiffrées, et leur publication est menacée pour forcer le paiement même lorsque des sauvegardes existent.<\u002Fp>\n    <p>L'écosystème s'est industrialisé autour du modèle <code>RaaS<\u002Fcode> (Ransomware-as-a-Service) : des opérateurs louent leur infrastructure et leur logiciel à des affiliés, qui se chargent de l'intrusion et partagent les gains.<\u002Fp>\n\n    <h2 id=\"sec-anatomie\">Anatomie d'une attaque<\u002Fh2>\n    <p>La quasi-totalité des campagnes suit la même chaîne d'exécution, souvent alignée sur le framework MITRE ATT&amp;CK. Chaque phase est une opportunité de détection.<\u002Fp>\n    <ol>\n      <li><strong>Accès initial.<\u002Fstrong> Hameçonnage, identifiant VPN compromis, ou exploitation d'un service exposé non corrigé.<\u002Fli>\n      <li><strong>Élévation &amp; persistance.<\u002Fstrong> L'attaquant obtient des droits privilégiés et installe des mécanismes de retour discrets.<\u002Fli>\n      <li><strong>Reconnaissance interne.<\u002Fstrong> Cartographie de l'Active Directory, repérage des sauvegardes et des données sensibles.<\u002Fli>\n      <li><strong>Mouvement latéral.<\u002Fstrong> Propagation de poste en poste via des identifiants volés et des outils légitimes (RDP, PsExec).<\u002Fli>\n      <li><strong>Exfiltration.<\u002Fstrong> Transfert des données vers un stockage contrôlé par l'attaquant.<\u002Fli>\n      <li><strong>Chiffrement.<\u002Fstrong> Déploiement simultané du payload sur l'ensemble du parc, souvent hors des heures ouvrées.<\u002Fli>\n    <\u002Fol>\n\n    <blockquote style=\"margin:36px 0;padding:4px 0 4px 26px;border-left:4px solid var(--aisi-orange)\">\n      <p style=\"font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.5;color:var(--aisi-navy);margin:0 0 12px\">« Le délai médian entre l'accès initial et le chiffrement est aujourd'hui inférieur à 24 heures. La fenêtre de détection se compte en heures, pas en jours. »<\u002Fp>\n      <footer style=\"font-size:14px;color:var(--text-muted)\">— Camille Mercier, Consultante SOC chez AISI<\u002Ffooter>\n    <\u002Fblockquote>\n\n    <h2 id=\"sec-vecteurs\">Vecteurs d'intrusion courants<\u002Fh2>\n    <p>Trois portes d'entrée concentrent la grande majorité des compromissions observées par nos équipes :<\u002Fp>\n    <ul>\n      <li><strong>Services d'accès distant exposés<\u002Fstrong> — RDP et VPN sans authentification multifacteur restent le vecteur numéro un.<\u002Fli>\n      <li><strong>Hameçonnage ciblé<\u002Fstrong> — pièces jointes piégées et pages de collecte d'identifiants toujours plus crédibles.<\u002Fli>\n      <li><strong>Vulnérabilités non corrigées<\u002Fstrong> — équipements de périphérie (pare-feux, passerelles) exposés à des CVE connues.<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"margin:32px 0\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Alert\" tone=\"danger\" title=\"Ne payez jamais dans l'urgence\" hint-size=\"100%,110px\">Le paiement ne garantit ni la restitution des données ni leur non-publication, finance directement l'écosystème criminel, et peut exposer votre organisation à des sanctions. Impliquez la direction, les autorités (ANSSI, gendarmerie) et votre assureur avant toute décision.<\u002Fx-import>\n    <\u002Fdiv>\n\n    <h2 id=\"sec-detection\">Détecter les signaux faibles<\u002Fh2>\n    <p>La détection précoce repose sur la corrélation de comportements anormaux plutôt que sur des signatures. Un exemple : le déclenchement d'une alerte lorsqu'un même compte génère un volume anormal de tentatives d'accès à des partages réseau — signature typique d'un mouvement latéral.<\u002Fp>\n\n    <figure style=\"margin:26px 0\">\n      <div style=\"background:var(--gray-900);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:11px 16px;background:#0f1014;border-bottom:1px solid rgba(255,255,255,.08)\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#f0605a\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#f5bf4f\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#5fce7f\"><\u002Fspan>\n          <span style=\"margin-left:8px;font-family:var(--font-mono);font-size:12px;color:var(--gray-400)\">detection-rule.yml<\u002Fspan>\n        <\u002Fdiv>\n        <pre style=\"margin:0;padding:20px 22px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:#e6e8ec\"><span style=\"color:#8b93a1\"># Sigma — mouvement latéral suspect (accès massif aux partages)<\u002Fspan>\n<span style=\"color:#7cc7f0\">title<\u002Fspan>: Acces anormal a de multiples partages reseau\n<span style=\"color:#7cc7f0\">status<\u002Fspan>: experimental\n<span style=\"color:#7cc7f0\">logsource<\u002Fspan>:\n  <span style=\"color:#7cc7f0\">product<\u002Fspan>: windows\n  <span style=\"color:#7cc7f0\">service<\u002Fspan>: security\n<span style=\"color:#7cc7f0\">detection<\u002Fspan>:\n  <span style=\"color:#7cc7f0\">selection<\u002Fspan>:\n    <span style=\"color:#7cc7f0\">EventID<\u002Fspan>: <span style=\"color:#f0a36a\">5140<\u002Fspan>\n    <span style=\"color:#7cc7f0\">ShareName<\u002Fspan>|endswith: <span style=\"color:#9fdca0\">'$'<\u002Fspan>\n  <span style=\"color:#7cc7f0\">timeframe<\u002Fspan>: <span style=\"color:#f0a36a\">5m<\u002Fspan>\n  <span style=\"color:#7cc7f0\">condition<\u002Fspan>: selection | count(ShareName) by SubjectUserName &gt; <span style=\"color:#f0a36a\">15<\u002Fspan>\n<span style=\"color:#7cc7f0\">level<\u002Fspan>: <span style=\"color:#f0a36a\">high<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <figcaption style=\"font-size:13px;color:var(--text-muted);margin-top:10px;font-style:italic\">Règle Sigma illustrative — à adapter au contexte et au niveau de bruit de votre SI.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div style=\"margin:32px 0\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Alert\" tone=\"info\" title=\"Journalisez avant d'avoir besoin des journaux\" hint-size=\"100%,96px\">Une règle de détection ne vaut que par la qualité des journaux qu'elle interroge. Activez l'audit des accès aux partages, la journalisation PowerShell et centralisez le tout dans un SIEM avant l'incident, pas pendant.<\u002Fx-import>\n    <\u002Fdiv>\n\n    <h2 id=\"sec-defense\">Stratégie de défense en profondeur<\u002Fh2>\n    <p>Aucune mesure isolée n'arrête un rançongiciel. L'efficacité vient de la superposition de contrôles indépendants, de sorte que la défaillance de l'un n'ouvre pas la voie à toute la chaîne.<\u002Fp>\n    <h3>Réduire la surface d'attaque<\u002Fh3>\n    <ul>\n      <li>Authentification multifacteur sur <strong>tous<\u002Fstrong> les accès distants et administrateurs.<\u002Fli>\n      <li>Correctifs priorisés sur les équipements de périphérie et les services exposés.<\u002Fli>\n      <li>Segmentation réseau limitant la propagation latérale.<\u002Fli>\n    <\u002Ful>\n    <h3>Se préparer à encaisser<\u002Fh3>\n    <ul>\n      <li>Sauvegardes immuables et hors-ligne, testées régulièrement en restauration.<\u002Fli>\n      <li>Principe du moindre privilège et comptes d'administration dédiés.<\u002Fli>\n      <li>Détection et réponse sur les postes (EDR) avec supervision 24/7.<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"margin:32px 0\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Alert\" tone=\"warning\" title=\"La règle 3-2-1-1-0\" hint-size=\"100%,96px\">Trois copies des données, sur deux supports différents, dont une hors-site, une immuable ou hors-ligne, et zéro erreur vérifiée lors des tests de restauration. C'est le dernier rempart quand tout le reste a cédé.<\u002Fx-import>\n    <\u002Fdiv>\n\n    <h2 id=\"sec-reponse\">Plan de réponse à incident<\u002Fh2>\n    <p>Quand la détection échoue, la rapidité et l'organisation de la réponse déterminent l'ampleur des dégâts. Les premières heures doivent être scriptées à l'avance :<\u002Fp>\n    <ol>\n      <li><strong>Isoler<\u002Fstrong> les systèmes touchés sans les éteindre, pour préserver les preuves en mémoire.<\u002Fli>\n      <li><strong>Qualifier<\u002Fstrong> le périmètre : quels systèmes, quelles données, quel vecteur.<\u002Fli>\n      <li><strong>Notifier<\u002Fstrong> direction, autorités et parties prenantes selon vos obligations légales.<\u002Fli>\n      <li><strong>Éradiquer &amp; restaurer<\u002Fstrong> à partir de sauvegardes saines, après validation de l'assainissement.<\u002Fli>\n      <li><strong>Capitaliser<\u002Fstrong> via un retour d'expérience pour corriger les failles exploitées.<\u002Fli>\n    <\u002Fol>\n\n    <h2 id=\"sec-conclusion\">En résumé<\u002Fh2>\n    <p>Le rançongiciel n'est pas une fatalité technologique mais un enchaînement d'étapes, chacune détectable et interruptible. La défense ne se joue pas au moment du chiffrement : elle se prépare en amont, par la réduction de la surface d'attaque, la journalisation, la sauvegarde immuable et un plan de réponse répété. <strong>La question n'est pas de savoir si votre organisation sera visée, mais si elle sera prête.<\u002Fstrong><\u002Fp>\n\n    <!-- Tags -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 8px;padding-top:28px;border-top:1px solid var(--border-subtle)\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Tag\" tone=\"blue\" hint-size=\"90px,30px\">Ransomware<\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Tag\" tone=\"blue\" hint-size=\"70px,30px\">SOC<\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Tag\" tone=\"blue\" hint-size=\"90px,30px\">MITRE ATT&amp;CK<\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Tag\" tone=\"neutral\" hint-size=\"90px,30px\">Sauvegarde<\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Tag\" tone=\"neutral\" hint-size=\"70px,30px\">EDR<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Farticle>\n<\u002Fdiv>\n\n<!-- Author bio -->\n<div style=\"max-width:1120px;margin:0 auto;padding:24px 32px 8px\">\n  <div style=\"max-width:936px;margin-left:auto\">\n    <x-import component-from-global-scope=\"DesignSystem_4b8b60.Card\" hint-size=\"100%,150px\">\n      <div style=\"display:flex;gap:20px;align-items:center\">\n        <div style=\"width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--aisi-blue),var(--aisi-navy));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:#fff;flex-shrink:0\">CM<\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px\">À propos de l'auteure<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--aisi-navy);margin-bottom:6px\">Camille Mercier<\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--gray-700);margin:0\">Consultante en cybersécurité chez AISI, Camille intervient sur la détection et la réponse à incident au sein du SOC managé. Elle accompagne les équipes techniques dans la mise en place de leur supervision de sécurité.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Related articles -->\n<section style=\"background:var(--gray-50);border-top:1px solid var(--border-subtle);margin-top:48px\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:64px 32px\">\n    <h2 style=\"font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--aisi-navy);margin:0 0 28px;letter-spacing:-.01em\">À lire également<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\">\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Card\" interactive=\"{{ true }}\" accent=\"blue\" hint-size=\"100%,220px\">\n        <div style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aisi-blue);margin-bottom:12px\">Zero Trust<\u002Fdiv>\n        <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.35;color:var(--aisi-navy);margin:0 0 10px\">Mettre en œuvre une architecture Zero Trust sans tout casser<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 14px\">Une feuille de route progressive pour passer du périmètre traditionnel au « ne jamais faire confiance, toujours vérifier ».<\u002Fp>\n        <span style=\"font-size:13px;color:var(--text-muted)\">8 min de lecture<\u002Fspan>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Card\" interactive=\"{{ true }}\" accent=\"orange\" hint-size=\"100%,220px\">\n        <div style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aisi-orange);margin-bottom:12px\">Conformité<\u002Fdiv>\n        <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.35;color:var(--aisi-navy);margin:0 0 10px\">NIS2 : ce que la directive change concrètement pour vos équipes<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 14px\">Périmètre, obligations de notification et gouvernance : décryptage opérationnel de la nouvelle réglementation.<\u002Fp>\n        <span style=\"font-size:13px;color:var(--text-muted)\">6 min de lecture<\u002Fspan>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"DesignSystem_4b8b60.Card\" interactive=\"{{ true }}\" accent=\"navy\" hint-size=\"100%,220px\">\n        <div style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aisi-navy);margin-bottom:12px\">SOC managé<\u002Fdiv>\n        <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.35;color:var(--aisi-navy);margin:0 0 10px\">Internaliser ou externaliser sa détection : le bon arbitrage<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 14px\">Coûts, expertise et couverture 24/7 : les critères pour décider entre SOC interne et SOC managé.<\u002Fp>\n        <span style=\"font-size:13px;color:var(--text-muted)\">7 min de lecture<\u002Fspan>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section style=\"max-width:1120px;margin:0 auto;padding:72px 32px\">\n  <div style=\"background:linear-gradient(120deg,var(--aisi-blue),var(--aisi-navy));border-radius:var(--radius-xl);padding:56px 48px;text-align:center;color:#fff\">\n    <h2 style=\"font-family:var(--font-display);font-weight:800;font-size:32px;margin:0 0 12px;letter-spacing:-.01em\">Évaluez votre exposition au ransomware<\u002Fh2>\n    <p style=\"font-size:17px;color:var(--aisi-blue-60);margin:0 auto 26px;max-width:520px\">Nos experts SOC réalisent un premier diagnostic de votre posture de sécurité — gratuit et sans engagement.<\u002Fp>\n    <x-import component-from-global-scope=\"DesignSystem_4b8b60.Button\" variant=\"accent\" size=\"lg\" hint-size=\"240px,48px\">Demander un diagnostic<\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--aisi-navy);color:#fff;padding:40px 32px\">\n  <div style=\"max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n    <img src=\"c9b4c15a-8024-40d7-b723-32172a685174\" alt=\"AISI\" style=\"height:26px;width:auto;display:block\">\n    <span style=\"font-size:13px;color:var(--aisi-blue-60)\">© 2026 AISI — Infrastructure, Cybersécurité &amp; Gouvernance. Tous droits réservés.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { activeId: 'sec-definition' };\n\n  sections = [\n    { id: 'sec-definition', label: \"Qu'est-ce qu'un ransomware ?\" },\n    { id: 'sec-anatomie',   label: \"Anatomie d'une attaque\" },\n    { id: 'sec-vecteurs',   label: \"Vecteurs d'intrusion\" },\n    { id: 'sec-detection',  label: \"Détecter les signaux faibles\" },\n    { id: 'sec-defense',    label: \"Défense en profondeur\" },\n    { id: 'sec-reponse',    label: \"Réponse à incident\" },\n    { id: 'sec-conclusion', label: \"En résumé\" },\n  ];\n\n  componentDidMount() {\n    this.observer = new IntersectionObserver((entries) => {\n      const visible = entries\n        .filter((e) => e.isIntersecting)\n        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);\n      if (visible.length) {\n        this.setState({ activeId: visible[0].target.id });\n      }\n    }, { rootMargin: '-88px 0px -70% 0px', threshold: 0 });\n    this.sections.forEach((s) => {\n      const el = document.getElementById(s.id);\n      if (el) this.observer.observe(el);\n    });\n  }\n\n  componentWillUnmount() {\n    if (this.observer) this.observer.disconnect();\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const y = el.getBoundingClientRect().top + window.scrollY - 84;\n    window.scrollTo({ top: y, behavior: 'smooth' });\n    this.setState({ activeId: id });\n  }\n\n  renderVals() {\n    const active = this.state.activeId;\n    const toc = this.sections.map((s) => {\n      const isActive = s.id === active;\n      return {\n        label: s.label,\n        href: '#' + s.id,\n        active: isActive,\n        onClick: (e) => { e.preventDefault(); this.scrollTo(s.id); },\n        style: [\n          'display:block',\n          'padding:7px 0 7px 16px',\n          'margin-left:-2px',\n          'font-size:14px',\n          'line-height:1.4',\n          'font-family:var(--font-body)',\n          'border-left:2px solid ' + (isActive ? 'var(--aisi-blue)' : 'transparent'),\n          'color:' + (isActive ? 'var(--aisi-navy)' : 'var(--text-muted)'),\n          'font-weight:' + (isActive ? '700' : '500'),\n          'cursor:pointer',\n          'transition:color .15s,border-color .15s',\n        ].join(';'),\n      };\n    });\n    return { toc };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
